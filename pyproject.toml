[project]
name = "pef-gemini"
version = "2.0.0"
description = "Zero Infrastructure, Zero Phishing: Serverless Email Security Framework on GCP with Cloud Run Functions, Pub/Sub, and Gemini 3.8 Flash"
authors = [
    { name = "Goran Minov" }
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.0.0,<3.0.0",
    "functions-framework>=3.8.0",
    "cloudevents>=1.11.0",
    "pydantic>=2.7.0",
    "google-cloud-pubsub>=2.21.0",
    "google-cloud-datastore>=2.19.0",
    "google-api-python-client>=2.126.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "tldextract>=5.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]
